services:

  app:
    image: mouadhradhouani/taches:recette

    ports:
      - "3001:3000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: todo
      MYSQL_PASSWORD: secret
      MYSQL_DB: todos

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: todos
      MYSQL_USER: todo
      MYSQL_PASSWORD: secret

    volumes:
      - donnees:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -utodo -psecret todos -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  donnees: